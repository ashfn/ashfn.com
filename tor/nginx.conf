worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 127.0.0.1:8080;
        server_name _;
        absolute_redirect off;
        # The public mirror must not expose the local authoring interface.
        location ^~ /editor { return 404; }
        location / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://host.docker.internal:4000;
            proxy_http_version 1.1;
            # A fixed public Host also preserves the editor's own host guard.
            proxy_set_header Host ashfncomabccvkuuvzbsjobu5wvtlw2wpz4mj3co5g5boyturbf36cyd.onion;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Onion-Location;
        }
    }
}
