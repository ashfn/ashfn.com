name: ashfn-onion-dev
services:
  onion:
    build: .
    image: ashfn-onion-dev:local
    container_name: ashfn-onion-dev
    init: true
    restart: unless-stopped
    environment:
      ONION_HOST: ashfncomabccvkuuvzbsjobu5wvtlw2wpz4mj3co5g5boyturbf36cyd.onion
    volumes:
      - type: bind
        source: ${TOR_KEY_DIR:?Set TOR_KEY_DIR to the existing onion key directory}
        target: /run/onion-key
        read_only: true
        bind:
          create_host_path: false
      - tor-data:/var/lib/tor
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "--max-time", "5", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
volumes:
  tor-data:
